name: leti_mobile
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^13.2.0

  equatable: ^2.0.5

  chopper: 8.4.0

  flutter_bloc: ^8.1.3

  flutter_screenutil: ^5.9.0

  flutter_svg: ^2.0.9

  http: ^1.1.0

  # hive: 2.0.6

  # hive_flutter: 1.0.0

  json_annotation: ^4.9.0

  logging: ^1.2.0

  shimmer: ^3.0.0

  # better_player: ^0.0.83

  #downloader feature starts here
  flutter_downloader: ^1.11.7

  percent_indicator: ^4.2.3

  permission_handler: ^11.0.1

  # open_file: ^3.3.2

  path_provider: ^2.1.1
  #end here

  flutter_gen: ^5.11.0

  url_launcher: ^6.1.14

  # package_info_plus: ^4.2.0

  share_plus: ^10.0.2

  intl: 

  flutter_dialogs: ^3.0.0

  bot_toast: ^4.1.3

  google_sign_in: ^6.1.6

  # connectivity_plus: ^2.0.2

  flutter_otp_text_field: ^1.1.3+2

  # get_it: ^7.6.7

  webview_flutter: ^4.8.0

  webview_flutter_wkwebview: ^3.22.0

  cached_network_image: 3.4.1

  flutter_widget_from_html_core: 0.16.0

  video_player: ^2.10.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: 

  chopper_generator: 8.4.0

  json_serializable: ^6.7.1

  # hive_generator:  1.1.3

  flutter_gen_runner: ^5.11.0

  arb_generator: 0.0.4



flutter_gen:
  output: lib/gen/ 
  line_length: 80 

  # Optional
  integrations:
    flutter_svg: true
    rive: true


arb_generator:
  input_filepath: "assets/localization/localization.csv"
  output_directory: "lib/l10n"
  filename_prepend: "app_"
  csv_settings:
    delimiter: ","
    base_index: 1


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/stores/
    - assets/icons/downloader/
    - assets/icons/home_tab_icons/
    - assets/icons/welcome_sign_forgot_icons/
    - assets/icons/main/
    - assets/icons/profile/
    - assets/icons/learning/
    - assets/icons/courses/
    - assets/icons/language_icons/
    - assets/icons/navbar/
    - assets/icons/chat/
    - assets/fonts/
    - assets/localization/
    
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Light.otf
          weight: 300
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400  
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.otf
          weight: 700

 
